# ─────────────────────────────────────────────────────────────────────────
# SCORING DEFINITIONS (all 0-100 unless noted)
# ─────────────────────────────────────────────────────────────────────────
# authority.google     — How well a profile on this platform ranks/appears
#                        in Google SERP for identity queries ("name + sector"),
#                        combined with DA, Knowledge Panel support, and
#                        Schema.org native handling.
# authority.llm        — How frequently LLMs (ChatGPT, Claude, Gemini,
#                        Perplexity, Google AIO) cite this source when
#                        describing professionals/brands. Heuristic combines
#                        Common Crawl presence + observed citation patterns
#                        + GEORadar telemetry.
# authority.trust      — How much weight this platform adds as a credibility
#                        signal for a third-party decision-maker (recruiter,
#                        prospect, journalist, board member).
# effort               — Effort to maintain active presence (0=set & forget,
#                        100=daily posting).
# algorithm_google     — Qualitative: low / medium / high
# algorithm_llms       — Qualitative: low / medium / high
# llms_citing          — Specific LLMs that demonstrably cite this source
# sectors_bonus        — Sectors where this platform punches above its base score
# status               — live · emerging · declining · dead
# brings               — One-line description of what it adds to a profile
# last_reviewed        — ISO date of last manual verification
# notes                — Optional one-line nuance

